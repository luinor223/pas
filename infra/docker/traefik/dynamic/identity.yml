http:
  routers:
    identity-public:
      rule: PathPrefix(`/api/v1/auth`)
      entryPoints: [web]
      # csrf guards refresh/logout (they carry pas_rt); login has no cookie yet, so it passes.
      middlewares: [identity-ratelimit, csrf@file, api-v1-strip]
      service: identity
    identity:
      rule: PathPrefix(`/api/v1/users`) || PathPrefix(`/api/v1/roles`)
      entryPoints: [web]
      middlewares: [identity-ratelimit, csrf@file, jwt-auth@file, api-v1-strip]
      service: identity
    identity-docs:
      rule: PathPrefix(`/docs/identity`)
      entryPoints: [web]
      middlewares: [identity-docs-strip]
      service: identity

  middlewares:
    identity-ratelimit:
      rateLimit:
        average: 100
        burst: 50
    api-v1-strip:
      stripPrefix:
        prefixes: [/api/v1]
    identity-docs-strip:
      stripPrefix:
        prefixes: [/docs/identity]

  services:
    identity:
      loadBalancer:
        servers:
          - url: http://identity-service:8001
