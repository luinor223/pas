http:
  routers:
    identity-me:
      rule: Path(`/api/v1/auth/me`)
      priority: 100
      entryPoints: [web]
      middlewares: [identity-ratelimit, jwt-auth@file, api-v1-strip]
      service: identity
    identity-public:
      rule: PathPrefix(`/api/v1/auth`)
      entryPoints: [web]
      middlewares: [identity-ratelimit, api-v1-strip]
      service: identity
    identity:
      rule: PathPrefix(`/api/v1/users`) || PathPrefix(`/api/v1/roles`) || PathPrefix(`/api/v1/departments`) || PathPrefix(`/api/v1/permissions`)
      entryPoints: [web]
      middlewares: [identity-ratelimit, jwt-auth@file, api-v1-strip]
      service: identity
    identity-docs:
      rule: PathPrefix(`/docs/identity`)
      entryPoints: [web]
      middlewares: [identity-docs-strip]
      service: identity

  middlewares:
    identity-ratelimit:
      rateLimit:
        average: 100
        burst: 50
    api-v1-strip:
      stripPrefix:
        prefixes: [/api/v1]
    identity-docs-strip:
      stripPrefix:
        prefixes: [/docs/identity]

  services:
    identity:
      loadBalancer:
        servers:
          - url: http://identity-service:8001
