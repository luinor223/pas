# Shared infra endpoints. Override per-environment with -f values-<env>.yaml
# (the same file across all service charts).
postgres:
  host: postgres
  port: 5432
redis:
  host: redis
  port: 6379
kafka:
  bootstrapServers: kafka:9092

jwt:
  issuer: pas-identity
  # RS256 public key PEM, used by the Traefik jwt-auth middleware.
  publicKey: ""
  # Secret holding jwt-private.pem, mounted into services that sign (identity).
  privateKeySecret: pas-jwt-private

ingress:
  entryPoint: web

service:
  name: contract
  httpPort: 8002
  grpcPort: 50052
  replicas: 1
  image:
    repository: ghcr.io/luinor223/pas-contract
    tag: main
    pullPolicy: IfNotPresent
  resources:
    limits:
      memory: 640Mi
    requests:
      memory: 512Mi
      cpu: 100m
  database:
    name: pas_contract
    user: contract
    password: contract   # override per-environment
  env:
    WORKFLOW_GRPC_HOST: "workflow-service"
    WORKFLOW_GRPC_PORT: "50056"
    ESIGN_GRPC_HOST: "esign-service"
    ESIGN_GRPC_PORT: "50057"
    ATTACHMENT_STORAGE_PATH: "/var/pas/attachments"
  secretEnv:
    PAGINATION_CURSOR_SECRET: "pagination-cursor-secret"
  secrets:
    pagination-cursor-secret: "local-development-pagination-cursor-secret"
  persistence:
    size: 1Gi
    mountPath: /var/pas/attachments
  routes:
    - /api/v1/customers
    - /api/v1/contracts
    - /api/v1/addenda
    - /api/v1/attachments
  rateLimit:
    average: 100
    burst: 50
