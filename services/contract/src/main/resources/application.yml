server:
  port: 8002

spring:
  application:
    name: contract-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pas_contract}
    username: ${DB_USER:contract}
    password: ${DB_PASSWORD:contract}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: contract

  flyway:
    enabled: true
    schemas: contract

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:20MB}
      max-request-size: ${MAX_REQUEST_SIZE:25MB}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
    web:
      pageable:
        max-page-size: 100

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: contract-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

  grpc:
    server:
      port: 50052
    client:
      workflow:
        address: static://workflow-service:50056
        negotiationType: PLAINTEXT

workflow:
  grpc:
    host: ${WORKFLOW_GRPC_HOST:localhost}
    port: ${WORKFLOW_GRPC_PORT:50056}

esign:
  grpc:
    host: ${ESIGN_GRPC_HOST:localhost}
    port: ${ESIGN_GRPC_PORT:50057}

redis:
  perm-prefix: "perm:role:"

outbox:
  relay:
    enabled: true
    claim-lease: PT60S
    batch-size: 100
    poll-interval: PT5S

contract:
  # Must be identical on every replica so issued page cursors survive load balancing and restarts.
  pagination-cursor-secret: ${PAGINATION_CURSOR_SECRET}
  kafka:
    dlt-suffix: ".DLT"
    # ~4 minutes of retry before the DLT, so a database or identity restart is not an audit gap
    retry-attempts: 8
    retry-backoff: PT2S
    max-retry-backoff: PT60S
  status-sweep-interval: PT60S
  expiry-warning-days: 30
  attachment-storage-path: ${ATTACHMENT_STORAGE_PATH:/var/pas/attachments}
  attachment-cleanup-interval: PT1H
  attachment-cleanup-grace: PT1H

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    version: openapi_3_1

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
