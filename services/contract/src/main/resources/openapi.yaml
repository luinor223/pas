openapi: 3.0.3
info:
  title: PAS Contract Service
  version: 1.0.0
  description: >
    Sales-owned aggregate (4.1-4.3) — customers, contracts, addenda, attachments.
    Status flips are owned here (D3) but driven by workflow.completed / the D14d scheduler;
    a client can never set a status directly. Signing progress is NOT here (D14e, registry §9³):
    the frontend composes GET /contracts/{id} with esign-service's
    GET /signing-sessions/by-document/{documentType}/{documentId} itself.
servers:
  - url: /api/v1
    description: Gateway (strips /api/v1)

paths:
  # ---------------------------------------------------------------- customers 4.1
  /customers:
    get:
      summary: List / search customers
      parameters:
        - { name: q, in: query, schema: { type: string }, description: name / code / tax_code }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, SUSPENDED] } }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 20 } }
      responses: { '200': { description: OK } }
      security: [{ bearerAuth: [] }]
    post:
      summary: Create customer (code auto-generated CUS-{seq})
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerRequest' }
      responses:
        '201': { description: Created }
        '403': { description: Requires customer:write }
        '422': { description: "Validation failed. `code` is server-generated (CUS-{seq}), never client-supplied" }
  /customers/{id}:
    get:
      summary: Customer detail (with contacts)
      responses: { '200': { description: OK }, '404': { description: Not found } }
      security: [{ bearerAuth: [] }]
    put:
      summary: Update customer
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerRequest' }
      responses:
        '200': { description: OK }
        '403': { description: Requires customer:write }
  /customers/{id}/suspend:
    post:
      summary: Suspend customer (4.1 "tạm ngưng") — ACTIVE -> SUSPENDED
      responses:
        '200': { description: OK }
        '403': { description: Requires customer:write }
      security: [{ bearerAuth: [] }]
  /customers/{id}/activate:
    post:
      summary: Reactivate customer — SUSPENDED -> ACTIVE
      responses:
        '200': { description: OK }
        '403': { description: Requires customer:write }
      security: [{ bearerAuth: [] }]
  /customers/{id}/contacts:
    get:
      summary: List contacts
      responses: { '200': { description: OK } }
      security: [{ bearerAuth: [] }]
    post:
      summary: Add contact (at most one is_primary per customer)
      responses: { '201': { description: Created } }
      security: [{ bearerAuth: [] }]
  /customers/{customerId}/contacts/{contactId}:
    put:
      summary: Update contact
      responses: { '200': { description: OK } }
      security: [{ bearerAuth: [] }]
    delete:
      summary: Remove contact
      responses: { '204': { description: Deleted } }
      security: [{ bearerAuth: [] }]

  # ---------------------------------------------------------------- contracts 4.2
  /contracts:
    get:
      summary: List / search contracts
      parameters:
        - { name: customerId, in: query, schema: { type: string, format: uuid }, description: 4.1 lookup by customer }
        - { name: status, in: query, schema: { type: string } }
        - { name: serviceGroup, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 20 } }
      responses: { '200': { description: OK } }
      security: [{ bearerAuth: [] }]
    post:
      summary: Create contract in DRAFT (contract_no auto-generated CTR-{YYYY}-{seq})
      description: status is server-owned; a client-supplied status is ignored (CTR-03).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContractRequest' }
      responses:
        '201': { description: Created }
        '403': { description: Requires contract:write }
        '422': { description: valid_from > valid_to (CTR-02). Customer validity is checked at submit, not here (db-contract.md) }
  /contracts/{id}:
    get:
      summary: Contract detail
      responses: { '200': { description: OK }, '404': { description: Not found } }
      security: [{ bearerAuth: [] }]
    put:
      summary: Update contract — CTR-01, DRAFT or REVISION_REQUESTED only
      description: >
        CTR-01 is an app-level state check; `version` is the optimistic lock (D5).
        A mismatched version is 409. Editing in any other status is 409 with code CTR_01,
        and on APPROVED/ACTIVE the message names the addendum route (CTR-07).
        An update applied while REVISION_REQUESTED also performs the registry §9 transition
        REVISION_REQUESTED -> DRAFT, writing a status_history row (trigger_kind=U) in the
        same transaction as the field update. Submit is then available from DRAFT.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContractRequest' }
      responses:
        '200': { description: OK }
        '403': { description: Requires contract:write }
        '409': { description: CTR-01 status guard or version conflict }
  /contracts/{id}/submit:
    post:
      summary: Submit for approval — DRAFT -> SUBMITTED (CTR-02)
      description: >
        Two phases (D4, registry §9¹). One local transaction commits SUBMITTED + a status_history
        row + a `workflow.start_requested` outbox row carrying a freshly generated idempotency_key;
        the relay then retries WorkflowInternal.StartInstance. Returns immediately with
        workflowState=INITIALIZATION_PENDING — the instance does not exist yet, and that is not an error.
        ValidateStartable is called as a pre-check before the commit so an unconfigured document type
        fails fast rather than parking in the outbox.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmitResponse' }
        '403': { description: Requires contract:write }
        '409': { description: Not DRAFT — a REVISION_REQUESTED document returns to DRAFT by being edited (registry §9) }
        '422': { description: CTR-02 — no attachment, customer not ACTIVE, invalid validity window, or missing/out-of-range vatRate or missing paymentTerm }
        '412': { description: ValidateStartable FAILED_PRECONDITION — no active workflow definition, or a step role with no ACTIVE holder }
  /contracts/{id}/cancel:
    post:
      summary: Cancel — DRAFT|SUBMITTED (ordinary) or ACTIVE (controlled, CTR-06)
      description: >
        From SUBMITTED this runs the M2 cancel-vs-dispatch handoff and may stay pending across
        several calls: the document is never flipped to CANCELLED on an inconclusive read.
        From ACTIVE it is a controlled cancel needing contract:cancel_active (CTR-06, D14a).
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { reason: { type: string } }
      responses:
        '200': { description: Cancelled }
        '202': { description: Cancellation pending — dispatch in flight, retry (M2) }
        '403': { description: ACTIVE cancel requires contract:cancel_active }
        '409': { description: A workflow step was already actioned, or status not cancellable }
  /contracts/{id}/revise:
    post:
      summary: Explicit revise — REJECTED -> DRAFT (CTR-04)
      description: CTR-04 forbids silently editing a rejected contract; this is the audited opt-in.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Back to DRAFT }
        '403': { description: Requires contract:write }
        '409': { description: Not REJECTED }
  /contracts/{id}/send-for-signing:
    post:
      summary: Send an APPROVED contract for e-signature (4.8, D10) — does NOT change contract status
      description: >
        Registry §6 third outbox use. Commits an `esign.session_requested` outbox row carrying a
        once-generated idempotency_key, with **no status change at all** (D14e — §5.5 forbids mixing
        approval state and signing state); the relay then retries EsignInternal.CreateSigningSession.
        The outbox is required, not optional: APR-07 wants the user's send action to survive
        esign-service being down, and a synchronous call committed afterwards would leave a session
        sending to the provider for a document still APPROVED, then deliver a callback §9 has no
        transition for. The contract stays APPROVED throughout, and APPROVED -> ACTIVE still fires
        purely on schedule regardless of signing progress (registry §9 footnote ³). Signing state is
        never persisted here — the frontend composes it from esign-service's
        GET /signing-sessions/by-document/{documentType}/{documentId}.
      security: [{ bearerAuth: [] }]
      responses:
        '202': { description: Send accepted and queued; contract status unchanged }
        '403': { description: Requires esign:send }
        '409': { description: Not APPROVED (GetSigningPayload's guard, registry §5) }

  /contracts/{id}/progress:
    get:
      summary: Approval progress and current handler (4.7 "Theo dõi tiến độ & người xử lý")
      description: >
        Proxies WorkflowInternal.GetInstanceByDocument and returns the snapshot chain that actually
        ran, not today's definition. NOT_FOUND, or a terminal instance while this document is still
        SUBMITTED, is D4's dispatch window — rendered as workflowState=INITIALIZATION_PENDING from
        local status, never retried here (registry §5.1's NOT_FOUND exception stays single).
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ProgressResponse' } } } }
      security: [{ bearerAuth: [] }]
  /contracts/{id}/history:
    get:
      summary: Local status timeline (D17 status_history, synchronous)
      description: Domain data. The eventual-consistency half of the History tab comes from audit-service.
      responses: { '200': { description: OK } }
      security: [{ bearerAuth: [] }]

  # ---------------------------------------------------------------- addenda 4.3
  /addenda:
    get:
      summary: List addenda
      parameters:
        - { name: contractId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string } }
      responses: { '200': { description: OK } }
      security: [{ bearerAuth: [] }]
    post:
      summary: Create addendum against an existing contract (addendum_no ADD-{YYYY}-{seq})
      description: >
        Carries no price data (D8) — a UNIT_PRICE_CHANGE addendum is realised as a pricing
        version created from it after approval. TERM_EXTENSION + new_valid_to IS renewal (D14b).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddendumRequest' }
      responses:
        '201': { description: Created }
        '403': { description: Requires addendum:write }
        '422': { description: Parent contract not APPROVED/ACTIVE, or change_type fields missing }
  /addenda/{id}:
    get:
      summary: Addendum detail
      responses: { '200': { description: OK } }
      security: [{ bearerAuth: [] }]
    put:
      summary: Update addendum — DRAFT or REVISION_REQUESTED only (CTR-01 applies equally)
      description: >
        As for a contract, an update applied while REVISION_REQUESTED also flips the status to
        DRAFT with a status_history row in the same transaction (registry §9).
      responses:
        '200': { description: OK }
        '409': { description: Status guard or version conflict }
      security: [{ bearerAuth: [] }]
  /addenda/{id}/submit:
    post:
      summary: Submit addendum for approval — its own workflow instance (4.3)
      description: Same D4 two-phase submit as a contract; the chain may differ by configuration.
      responses:
        '200': { description: Submitted, content: { application/json: { schema: { $ref: '#/components/schemas/SubmitResponse' } } } }
        '412': { description: ValidateStartable FAILED_PRECONDITION }
      security: [{ bearerAuth: [] }]
  /addenda/{id}/cancel:
    post:
      summary: Cancel addendum (same M2 handoff as a contract)
      responses: { '200': { description: Cancelled }, '202': { description: Pending } }
      security: [{ bearerAuth: [] }]
  /addenda/{id}/revise:
    post:
      summary: Explicit revise — REJECTED -> DRAFT (CTR-04)
      responses: { '200': { description: OK } }
      security: [{ bearerAuth: [] }]
  /addenda/{id}/progress:
    get:
      summary: Approval progress for the addendum's own instance
      responses: { '200': { description: OK } }
      security: [{ bearerAuth: [] }]

  # ---------------------------------------------------------------- attachments
  /attachments:
    get:
      summary: List attachments for one owner
      parameters:
        - { name: ownerType, in: query, required: true, schema: { type: string, enum: [CONTRACT, ADDENDUM] } }
        - { name: ownerId, in: query, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: OK } }
      security: [{ bearerAuth: [] }]
    post:
      summary: Upload an attachment (multipart) — CTR-02 requires >=1 before submit
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ownerType, ownerId, file]
              properties:
                ownerType: { type: string, enum: [CONTRACT, ADDENDUM] }
                ownerId: { type: string, format: uuid }
                file: { type: string, format: binary }
      responses:
        '201': { description: Uploaded }
        '409': { description: Owner not in an editable status (CTR-01) }
      security: [{ bearerAuth: [] }]
  /attachments/{id}:
    get:
      summary: Download an attachment
      responses: { '200': { description: OK } }
      security: [{ bearerAuth: [] }]
    delete:
      summary: Delete an attachment — owner must be editable (CTR-01)
      responses:
        '204': { description: Deleted }
        '409': { description: Owner not editable }
      security: [{ bearerAuth: [] }]

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Validated at the edge (D11), which injects X-User-Id / X-Username / X-Full-Name /
        X-Department / X-Roles. This service reads those headers and resolves permissions
        from the Redis perm:role:* cache — it performs no JWT crypto of its own.
  schemas:
    CustomerRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        shortName: { type: string }
        taxCode: { type: string }
        address: { type: string }
        representativeName: { type: string }
        representativePosition: { type: string }
        segment: { type: string }
    ContractRequest:
      type: object
      required: [customerId, serviceGroup, validFrom, validTo]
      properties:
        customerId: { type: string, format: uuid }
        description: { type: string }
        serviceGroup: { type: string, enum: [STEVEDORING, WAREHOUSING, TRANSPORTATION, CONTAINER_HANDLING] }
        value: { type: number }
        currency: { type: string, default: VND }
        validFrom: { type: string, format: date }
        validTo: { type: string, format: date }
        paymentTerm:
          type: string
          description: >
            Optional in DRAFT, REQUIRED at submit (CTR-02). Shares its value space with
            AddendumRequest.paymentTermOverride, which replaces this value when a PAYMENT_TERMS
            addendum takes effect (registry §9 footnote ²).
        billingCycle: { type: string, enum: [MONTHLY] }
        vatRate:
          type: number
          minimum: 0
          maximum: 100
          description: >
            Percent. Optional in DRAFT, REQUIRED at submit (CTR-02). Null means "not stated" and is
            never coerced to 0 — 0% is a deliberate, billable value, and silently treating the two
            alike is the invoice drift the system exists to prevent.
        penaltyTerms: { type: string }
        serviceClause: { type: string }
        version: { type: integer, description: optimistic lock, required on update (CTR-01) }
    AddendumRequest:
      type: object
      required: [contractId, changeType, effectiveFrom]
      properties:
        contractId: { type: string, format: uuid }
        changeType: { type: string, enum: [UNIT_PRICE_CHANGE, TERM_EXTENSION, ADDED_SERVICE, PAYMENT_TERMS] }
        description: { type: string }
        effectiveFrom: { type: string, format: date }
        newValidTo: { type: string, format: date, description: required for TERM_EXTENSION (D14b renewal) }
        paymentTermOverride: { type: string, description: required for PAYMENT_TERMS }
        services:
          type: array
          description: >
            Services added by an ADDED_SERVICE addendum (requirement 4.3). Record/display data only —
            it does NOT widen the contract's enforced scope: ContractInternal.GetContract still returns
            contract.serviceGroup, and operations-service validates volume entries against that alone.
            Carries no prices (D8); an added service still needs its own pricing version.
          items: { $ref: '#/components/schemas/AddendumService' }
        version: { type: integer }
    AddendumService:
      type: object
      required: [serviceCode, serviceName]
      properties:
        serviceItemId: { type: string, format: uuid, description: pricing-service service_item, if known }
        serviceCode: { type: string }
        serviceName: { type: string }
        unit: { type: string }
        scopeNote: { type: string }
    SubmitResponse:
      type: object
      properties:
        status: { type: string, example: SUBMITTED }
        workflowState:
          type: string
          enum: [INITIALIZATION_PENDING, IN_PROGRESS]
          description: INITIALIZATION_PENDING is D4's dispatch window, not an error
    ProgressResponse:
      type: object
      properties:
        documentStatus: { type: string }
        workflowState: { type: string, enum: [INITIALIZATION_PENDING, IN_PROGRESS, COMPLETED] }
        instanceId: { type: string, format: uuid, nullable: true }
        currentStep:
          type: object
          nullable: true
          description: null once the instance is terminal
        steps:
          type: array
          description: the snapshot chain taken at instance creation, not today's definition
          items: { type: object }
