server:
  port: 8005
  forward-headers-strategy: framework

spring:
  application:
    name: billing-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pas_billing}
    username: ${DB_USER:billing}
    password: ${DB_PASSWORD:billing}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: billing
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    schemas: billing

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: billing-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

  grpc:
    server:
      port: 50055

contract:
  grpc:
    host: ${CONTRACT_GRPC_HOST:localhost}
    port: ${CONTRACT_GRPC_PORT:50052}

pricing:
  grpc:
    host: ${PRICING_GRPC_HOST:localhost}
    port: ${PRICING_GRPC_PORT:50053}

operations:
  grpc:
    host: ${OPERATIONS_GRPC_HOST:localhost}
    port: ${OPERATIONS_GRPC_PORT:50054}

workflow:
  grpc:
    host: ${WORKFLOW_GRPC_HOST:localhost}
    port: ${WORKFLOW_GRPC_PORT:50056}

esign:
  grpc:
    host: ${ESIGN_GRPC_HOST:localhost}
    port: ${ESIGN_GRPC_PORT:50057}

redis:
  perm-prefix: "perm:role:"

outbox:
  relay:
    enabled: true
    claim-lease: PT60S
    batch-size: 100
    poll-interval: PT5S

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    version: openapi_3_1

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
