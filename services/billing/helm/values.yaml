# Shared infra endpoints. Override per-environment with -f values-<env>.yaml
# (the same file across all service charts).
postgres:
  host: postgres
  port: 5432
redis:
  host: redis
  port: 6379
kafka:
  bootstrapServers: kafka:9092

jwt:
  issuer: pas-identity
  # RS256 public key PEM, used by the Traefik jwt-auth middleware.
  publicKey: ""
  # Secret holding jwt-private.pem, mounted into services that sign (identity).
  privateKeySecret: pas-jwt-private

ingress:
  entryPoint: web

service:
  name: billing
  httpPort: 8005
  grpcPort: 50055
  replicas: 1
  image:
    repository: ghcr.io/luinor223/pas-billing
    tag: main
    pullPolicy: IfNotPresent
  resources:
    limits:
      memory: 640Mi
    requests:
      memory: 512Mi
      cpu: 100m
  database:
    name: pas_billing
    user: billing
    # db-password comes from the external Secret (service.secretName)
  env:
    CONTRACT_GRPC_HOST: "contract-service"
    CONTRACT_GRPC_PORT: "50052"
    PRICING_GRPC_HOST: "pricing-service"
    PRICING_GRPC_PORT: "50053"
    OPERATIONS_GRPC_HOST: "operations-service"
    OPERATIONS_GRPC_PORT: "50054"
    WORKFLOW_GRPC_HOST: "workflow-service"
    WORKFLOW_GRPC_PORT: "50056"
    ESIGN_GRPC_HOST: "esign-service"
    ESIGN_GRPC_PORT: "50057"
  routes:
    - /api/v1/payment-statements
  docsPath: /docs/billing
  rateLimit:
    average: 100
    burst: 50
