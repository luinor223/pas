openapi: 3.0.3
info:
  title: PAS Audit Service
  version: 1.0.0
  description: >
    The single centralized audit trail (4.10, D15) — a read model, not a bounded context. It has
    no invariants, no state machine and produces nothing. Two read paths exist and neither
    substitutes for the other (seq-02): this REST search is cross-entity admin traffic gated by
    `audit:view_all`, while `AuditInternal.ListRecords` (gRPC) fills one owning service's History
    tab. Status history is NOT here — it stays local to each owner (D17), and a business rule may
    only read that. Rows are immutable: the table grants INSERT + SELECT only, so no endpoint
    here can mutate the trail.
servers:
  - url: /api/v1
    description: Gateway (strips /api/v1)

paths:
  /audit-records:
    get:
      summary: Cross-entity audit search (admin UC "Tra cứu audit log")
      description: >
        Every filter is optional and ANDed; results are `occurred_at DESC`. `actorName` and
        `actorDepartment` render from each row's write-time snapshot and are never resolved
        against identity, so a renamed or disabled user does not change what a past record shows
        (4.10).
      parameters:
        - { name: entityType, in: query, schema: { type: string }, description: "free text — each context's own vocabulary" }
        - { name: query, in: query, schema: { type: string }, description: "case-insensitive partial match on record number, username or actor name" }
        - { name: entityNo, in: query, deprecated: true, schema: { type: string }, description: "legacy record-number search; ignored when query is supplied" }
        - { name: actorId, in: query, schema: { type: string, format: uuid } }
        - { name: sourceService, in: query, schema: { type: string, enum: [identity-service, contract-service, pricing-service, operations-service, billing-service, workflow-service, esign-service] } }
        - { name: action, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditRecordPage' }
        '403': { description: Requires audit:view_all (SYSTEM_ADMIN alone, registry §7) }
      security: [{ bearerAuth: [] }]

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    AuditRecordPage:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/AuditRecordResponse' }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        number: { type: integer }
        size: { type: integer }
    AuditRecordResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: the producer's outbox row id = envelope event_id; also the dedup key
        sourceService: { type: string }
        entityType: { type: string }
        entityId: { type: string, format: uuid }
        entityNo: { type: string, nullable: true }
        action: { type: string }
        actorId: { type: string, format: uuid, nullable: true, description: "null for system/scheduler actions" }
        actorName: { type: string, description: "write-time snapshot; 'system' when unattributed" }
        actorDepartment: { type: string, nullable: true }
        beforeStatus: { type: string, nullable: true }
        afterStatus: { type: string, nullable: true }
        changes:
          type: object
          additionalProperties: true
          description: stored and returned verbatim, never interpreted by this service
        note: { type: string, nullable: true }
        ipAddress: { type: string, nullable: true }
        occurredAt: { type: string, format: date-time }
