# Shared infra endpoints. Override per-environment with -f values-<env>.yaml
# (the same file across all service charts).
postgres:
  host: postgres
  port: 5432
redis:
  host: redis
  port: 6379
kafka:
  bootstrapServers: kafka:9092

jwt:
  issuer: pas-identity
  # RS256 public key PEM, used by the Traefik jwt-auth middleware.
  publicKey: ""
  # Secret holding jwt-private.pem, mounted into services that sign (identity).
  privateKeySecret: pas-jwt-private

ingress:
  entryPoint: web

service:
  name: audit
  httpPort: 8009
  grpcPort: 50059
  replicas: 1
  image:
    repository: ghcr.io/luinor223/pas-audit
    tag: main
    pullPolicy: IfNotPresent
  resources:
    limits:
      memory: 640Mi
    requests:
      memory: 512Mi
      cpu: 100m
  database:
    name: pas_audit
    user: audit
    password: audit   # override per-environment
  env: {}
  routes:
    - /api/v1/audit-records
  docsPath: /docs/audit
  rateLimit:
    average: 100
    burst: 50
