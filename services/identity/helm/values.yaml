# Shared infra endpoints. Override per-environment with -f values-<env>.yaml
# (the same file across all service charts).
postgres:
  host: postgres
  port: 5432
redis:
  host: redis
  port: 6379
kafka:
  bootstrapServers: kafka:9092

jwt:
  issuer: pas-identity
  # RS256 public key PEM, used by the Traefik jwt-auth middleware.
  publicKey: ""
  # Secret holding jwt-private.pem, mounted into services that sign (identity).
  privateKeySecret: pas-jwt-private

ingress:
  entryPoint: web

service:
  name: identity
  httpPort: 8001
  grpcPort: 50051
  replicas: 1
  signsJwt: true
  image:
    repository: ghcr.io/luinor223/pas-identity
    tag: main
    pullPolicy: IfNotPresent
  resources:
    limits:
      memory: 640Mi
    requests:
      memory: 512Mi
      cpu: 100m
  database:
    name: pas_identity
    user: identity
    password: identity   # override per-environment
  env: {}
  routes:
    - /api/v1/users
    - /api/v1/roles
    - /api/v1/departments
    - /api/v1/permissions
  publicRoutes:
    - /api/v1/auth
  docsPath: /docs/identity
  rateLimit:
    average: 100
    burst: 50
