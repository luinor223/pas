# Shared infra endpoints. Override per-environment with -f values-<env>.yaml
# (the same file across all service charts).
postgres:
  host: postgres
  port: 5432
redis:
  host: redis
  port: 6379
kafka:
  bootstrapServers: kafka:9092

jwt:
  issuer: pas-identity
  # RS256 public key PEM, used by the Traefik jwt-auth middleware.
  publicKey: ""
  # Secret holding jwt-private.pem, mounted into services that sign (identity).
  privateKeySecret: pas-jwt-private

ingress:
  entryPoint: web

service:
  name: workflow
  httpPort: 8006
  grpcPort: 50056
  replicas: 1
  image:
    repository: ghcr.io/luinor223/pas-workflow
    tag: main
    pullPolicy: IfNotPresent
  resources:
    limits:
      memory: 640Mi
    requests:
      memory: 512Mi
      cpu: 100m
  database:
    name: pas_workflow
    user: workflow
    password: workflow   # override per-environment
  env:
    IDENTITY_GRPC_HOST: "identity-service"
    IDENTITY_GRPC_PORT: "50051"
  routes:
    - /api/v1/workflow-definitions
    - /api/v1/workflow-steps
    - /api/v1/document-types
    - /api/v1/inbox
  docsPath: /docs/workflow
  rateLimit:
    average: 100
    burst: 50
