openapi: 3.0.3
info:
  title: PAS Workflow Service
  version: 1.0.0
  description: Configurable approval engine (4.7) — workflow definitions, instances, step actions, inbox
servers:
  - url: /api/v1
    description: Gateway (strips /api/v1)
paths:
  /workflow-definitions:
    get:
      summary: List workflow definitions
      parameters:
        - name: documentTypeCode
          in: query
          schema: { type: string, enum: [CONTRACT, ADDENDUM, PRICE_LIST, PAYMENT_STATEMENT] }
      responses:
        '200': { description: OK }
      security: [{ bearerAuth: [] }]
    post:
      summary: Create new workflow definition version (inactive)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentTypeCode, name]
              properties:
                documentTypeCode: { type: string }
                name: { type: string }
      responses:
        '201': { description: Created }
        '403': { description: Requires workflow:configure }
  /workflow-definitions/{id}:
    get:
      summary: Get definition by id
      responses: { '200': { description: OK } }
      security: [{ bearerAuth: [] }]
  /workflow-definitions/{id}/steps:
    put:
      summary: Replace steps (only when is_active=false, FOR UPDATE)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [steps]
              properties:
                steps:
                  type: array
                  items:
                    type: object
                    required: [name, approverRole, slaHours]
                    properties:
                      name: { type: string }
                      approverRole: { type: string }
                      slaHours: { type: integer, minimum: 1 }
      responses:
        '200': { description: OK }
        '412': { description: Active definition not editable (FAILED_PRECONDITION) }
  /workflow-definitions/{id}/activate:
    post:
      summary: Deactivate incumbent and activate target in one tx (idempotent if already active)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
  /workflow-steps/{stepInstanceId}/actions:
    post:
      summary: Approve / Reject / Request revision (APR-01 contextual via step_assignee, APR-03, D5)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [APPROVE, REJECT, REQUEST_REVISION] }
                comment: { type: string }
      responses:
        '204': { description: No Content }
        '403': { description: Not assignee or missing approval:act }
        '409': { description: ABORTED (optimistic lock) }
        '412': { description: Step not ACTIVE or comment required }
  /inbox:
    get:
      summary: Approvals inbox (Assigned / Submitted / Completed)
      parameters:
        - name: tab
          in: query
          schema: { type: string, enum: [ASSIGNED, SUBMITTED, COMPLETED], default: ASSIGNED }
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: OK } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
