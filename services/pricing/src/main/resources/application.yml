server:
  port: 8003
  forward-headers-strategy: framework

spring:
  application:
    name: pricing-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pas_pricing}
    username: ${DB_USER:pricing}
    password: ${DB_PASSWORD:pricing}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: pricing

  flyway:
    enabled: true
    schemas: pricing

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: pricing-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

  grpc:
    server:
      port: 50053

workflow:
  grpc:
    host: ${WORKFLOW_GRPC_HOST:localhost}
    port: ${WORKFLOW_GRPC_PORT:50056}

pricing:
  kafka:
    listener-enabled: true
  status-sweep-interval: PT60S
  status-sweep-enabled: true
  expiry-warning-days: 30

redis:
  perm-cache-ttl: PT6H
  perm-prefix: "perm:role:"

outbox:
  relay:
    enabled: true
    claim-lease: PT60S
    batch-size: 100
    poll-interval: PT5S

management:
  endpoints:
    web:
      exposure:
        include: health,info
