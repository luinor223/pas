openapi: 3.0.3
info:
  title: PAS Pricing Service
  version: 1.0.0
  description: >
    Service catalog and versioned, time-bounded price lists (4.4, PRC-01..06). Overlap guard
    (PRC-03), truncate-then-approve (§9³), historical effective lookup for billing.
servers:
  - url: /api/v1
    description: Gateway (strips /api/v1)
paths:
  /service-items:
    get:
      summary: List catalog service items (pricelist:read)
      parameters:
        - name: activeOnly
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200': { description: OK }
        '403': { description: Requires pricelist:read }
      security: [{ bearerAuth: [] }]
  /service-items/{code}:
    get:
      summary: Get a service item by its business code (pricelist:read)
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '403': { description: Requires pricelist:read }
        '404': { description: No such service item }
      security: [{ bearerAuth: [] }]

  /price-lists:
    get:
      summary: List price lists (scope filters)
      parameters:
        - name: customerId
          in: query
          schema: { type: string, format: uuid }
        - name: contractId
          in: query
          schema: { type: string, format: uuid }
        - name: serviceGroup
          in: query
          schema: { type: string, enum: [STEVEDORING, WAREHOUSING, TRANSPORTATION, CONTAINER_HANDLING] }
      responses:
        '200': { description: OK }
      security: [{ bearerAuth: [] }]
    post:
      summary: Create a price list (scope frozen once a version exists, PRC-01)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customerId: { type: string, format: uuid }
                contractId: { type: string, format: uuid }
                serviceGroup: { type: string }
                note: { type: string }
      responses:
        '201': { description: Created }
        '400': { description: No scope field set (PRC-01) }
        '403': { description: Requires pricelist:write }
  /price-lists/{id}:
    get:
      summary: Get a price list with its versions
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
      security: [{ bearerAuth: [] }]

  /price-lists/{id}/versions:
    post:
      summary: Add a DRAFT version (D8 addendumId defaults valid_from to the addendum effective_from)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [validFrom, validTo]
              properties:
                validFrom: { type: string, format: date }
                validTo: { type: string, format: date }
                addendumId: { type: string, format: uuid }
      responses:
        '201': { description: Created }
        '400': { description: valid_from > valid_to (PRC-02) }
  /price-lists/{id}/versions/{versionId}:
    get:
      summary: Get a version with its lines and status history
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK }
      security: [{ bearerAuth: [] }]
  /price-lists/{id}/versions/{versionId}/lines:
    put:
      summary: Replace the price lines (DRAFT only, PRC-05)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines:
                  type: array
                  items:
                    type: object
                    required: [serviceCode, unitPrice]
                    properties:
                      serviceCode: { type: string }
                      unitPrice: { type: number, minimum: 0 }
      responses:
        '200': { description: OK }
        '412': { description: Version not editable past DRAFT (PRC-05) }
  /price-lists/{id}/versions/{versionId}/submit:
    post:
      summary: Submit for approval (D4 — SUBMITTED + workflow.start_requested outbox row, one tx)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Submitted — workflow initialization pending }
        '409': { description: Not in DRAFT, or overlaps an effective version (PRC-03) }
      security: [{ bearerAuth: [] }]
  /price-lists/{id}/versions/{versionId}/revise:
    post:
      summary: Revise a REJECTED version back to DRAFT (PRC-06)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK }
        '409': { description: Not in REJECTED }
      security: [{ bearerAuth: [] }]

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
