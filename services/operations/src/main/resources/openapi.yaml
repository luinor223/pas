openapi: 3.0.3
info:
  title: Operations Service API
  version: 1.0.0
  description: Lockable global monthly periods feeding billing (Session 5)
servers:
  - url: /api/v1
paths:
  /periods:
    post:
      summary: Create operation period
      operationId: createPeriod
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [periodCode]
              properties:
                periodCode:
                  type: string
                  pattern: '^\d{4}-(0[1-9]|1[0-2])$'
                  example: '2026-08'
      responses:
        '201':
          description: Created
        '400':
          description: Invalid period_code
        '409':
          description: Period already exists
      x-permission: volume:write
    get:
      summary: List periods
      operationId: listPeriods
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
      x-permission: volume:read
  /periods/{periodCode}:
    get:
      summary: Get period by code
      operationId: getPeriod
      security:
        - bearerAuth: []
      parameters:
        - name: periodCode
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      responses:
        '200':
          description: OK
        '404':
          description: Not found
      x-permission: volume:read
  /periods/{periodCode}/lock:
    post:
      summary: Lock period (OPEN->LOCKED, idempotent)
      operationId: lockPeriod
      security:
        - bearerAuth: []
      parameters:
        - name: periodCode
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Locked (or already locked)
        '403':
          description: Requires volume:lock_period
        '404':
          description: Period not found
      x-permission: volume:lock_period
  /volume-records:
    post:
      summary: Create volume record (validates service_code via pricing, contract via contract)
      operationId: createVolume
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contractId, periodCode, serviceCode, quantity]
              properties:
                contractId:
                  type: string
                  format: uuid
                periodCode:
                  type: string
                  pattern: '^\d{4}-(0[1-9]|1[0-2])$'
                serviceCode:
                  type: string
                  example: 'CONT_LIFT'
                quantity:
                  type: number
                  minimum: 0
                note:
                  type: string
      responses:
        '201':
          description: Created
        '400':
          description: Validation failed
        '403':
          description: Period locked without volume:edit_locked
        '404':
          description: Period/contract/service not found
      x-permission: volume:write or volume:edit_locked
    get:
      summary: List volume records
      operationId: listVolumes
      description: Filter by periodCode, contractId, or both (AND when both supplied). Billing calls ListVolumes(contract_id, period_code) with both.
      security:
        - bearerAuth: []
      parameters:
        - name: periodCode
          in: query
          description: YYYY-MM, when supplied filters to that period; combined with contractId via AND
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        - name: contractId
          in: query
          description: Contract UUID, when supplied filters to that contract; combined with periodCode via AND
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
      x-permission: volume:read
  /volume-records/{id}:
    get:
      summary: Get volume record
      operationId: getVolume
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
        '404':
          description: Not found
      x-permission: volume:read
    put:
      summary: Update volume record (guard OPEN or volume:edit_locked + audit)
      operationId: updateVolume
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity:
                  type: number
                  minimum: 0
                note:
                  type: string
      responses:
        '200':
          description: OK
        '400':
          description: Validation failed
        '403':
          description: Period locked without volume:edit_locked
        '404':
          description: Not found
      x-permission: volume:write or volume:edit_locked
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
