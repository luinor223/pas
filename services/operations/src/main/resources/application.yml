server:
  port: 8004
  forward-headers-strategy: framework

spring:
  application:
    name: operations-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pas_operations}
    username: ${DB_USER:operations}
    password: ${DB_PASSWORD:operations}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: operations

  flyway:
    enabled: true
    schemas: operations

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: operations-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

  grpc:
    server:
      port: 50054

redis:
  perm-cache-ttl: PT6H
  perm-prefix: "perm:role:"

outbox:
  relay:
    enabled: true
    claim-lease: PT60S
    batch-size: 100
    poll-interval: PT5S

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    version: openapi_3_1
