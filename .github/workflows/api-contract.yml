name: API contract

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contract-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Compare runtime OpenAPI with the versioned contract
        run: ./gradlew :services:contract-service:test --tests com.abclogistics.pas.contract.CustomerCrudTest -PincludeIntegration
      - name: Check generated TypeScript and compile the web app
        working-directory: web
        run: bun run api:check && bun run build
