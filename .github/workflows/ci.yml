name: ci

# Compile and test on every PR and on main. Only the touched services are
# built; a shared change (libs, proto, root gradle, this workflow) builds all.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      gradle_args: ${{ steps.pick.outputs.gradle_args }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pick gradle targets
        id: pick
        env:
          ALL: "audit billing contract esign esign-mock-provider identity notification operations pricing workflow"
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == workflow_dispatch ]]; then
            echo "gradle_args=build" >>"$GITHUB_OUTPUT"; exit 0
          fi
          if [[ "$EVENT" == pull_request ]]; then
            git fetch --quiet origin "$BASE_REF"
            changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          elif [[ -z "$BEFORE" || "$BEFORE" == 0000000000000000000000000000000000000000 ]]; then
            echo "gradle_args=build" >>"$GITHUB_OUTPUT"; exit 0
          else
            changed=$(git diff --name-only "$BEFORE" "$SHA")
          fi
          if grep -qE '^(libs/|proto/|gradle/|gradlew|settings\.gradle\.kts|build\.gradle\.kts|gradle\.properties|\.github/workflows/ci\.yml)' <<<"$changed"; then
            echo "gradle_args=build" >>"$GITHUB_OUTPUT"; exit 0
          fi
          touched=$(grep -oE '^services/[^/]+' <<<"$changed" | sed 's#services/##' | sort -u || true)
          args=""
          for s in $touched; do
            grep -qw "$s" <<<"$ALL" && args+=" :services:${s}-service:build"
          done
          echo "gradle_args=${args# }" >>"$GITHUB_OUTPUT"

  build:
    needs: select
    if: needs.select.outputs.gradle_args != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        env:
          GRADLE_ARGS: ${{ needs.select.outputs.gradle_args }}
        run: ./gradlew $GRADLE_ARGS --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          retention-days: 7
