name: build-push

# Build changed service images with Jib and push to GHCR (no Docker daemon).
#   push to main -> tags: main, sha-<short> (only services affected by the merge)
#   push tag v*  -> tags: <semver>, <major.minor>, latest (all services)
#   manual run   -> all services
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide which services to build. A shared change (libs, proto, root gradle,
  # this workflow) rebuilds everything; a tag or manual run also builds all.
  select:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.pick.outputs.services }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pick services
        id: pick
        env:
          ALL: '["audit","billing","contract","esign","esign-mock-provider","identity","notification","operations","pricing","workflow"]'
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* || "$GITHUB_EVENT_NAME" == workflow_dispatch \
                || -z "$BEFORE" || "$BEFORE" == 0000000000000000000000000000000000000000 ]]; then
            echo "services=$ALL" >>"$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" "$SHA")
          if grep -qE '^(libs/|proto/|gradle/|gradlew|settings\.gradle\.kts|build\.gradle\.kts|gradle\.properties|\.github/workflows/build-push\.yml)' <<<"$changed"; then
            echo "services=$ALL" >>"$GITHUB_OUTPUT"; exit 0
          fi
          services=$(grep -oE '^services/[^/]+' <<<"$changed" | sed 's#services/##' | sort -u | jq -R . | jq -sc .)
          echo "services=${services:-[]}" >>"$GITHUB_OUTPUT"

  build:
    needs: select
    if: needs.select.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.select.outputs.services) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$REF" == refs/tags/v* ]]; then
            v="${REF#refs/tags/v}"
            echo "primary=$v" >>"$GITHUB_OUTPUT"
            echo "extra=${v%.*},latest" >>"$GITHUB_OUTPUT"
          else
            echo "primary=main" >>"$GITHUB_OUTPUT"
            echo "extra=sha-${SHA::7}" >>"$GITHUB_OUTPUT"
          fi

      - name: Build and push with Jib
        env:
          SERVICE: ${{ matrix.service }}
          OWNER: ${{ github.repository_owner }}
          PRIMARY: ${{ steps.tags.outputs.primary }}
          EXTRA: ${{ steps.tags.outputs.extra }}
        run: |
          set -euo pipefail
          owner="${OWNER,,}"
          ./gradlew ":services:${SERVICE}-service:jib" \
            -Djib.to.image="ghcr.io/${owner}/pas-${SERVICE}:${PRIMARY}" \
            -Djib.to.tags="${EXTRA}" \
            --no-daemon
