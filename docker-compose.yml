services:
  traefik:
    image: traefik:v3.1
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infra/docker/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./infra/docker/traefik/plugins-local:/plugins-local:ro
    ports:
      - "18080:80"
      - "18090:8080"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pas
      POSTGRES_USER: pas
      POSTGRES_PASSWORD: pas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pas -d pas"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "19092:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Waiting for Kafka to be ready..."
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list; do sleep 2; done
        echo "Creating topics..."
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic pas.events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic pas.audit --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic pas.events.DLT --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic pas.audit.DLT --partitions 1 --replication-factor 1
        echo "Topics created:"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic pas.events
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic pas.audit
    restart: "no"

  identity-service:
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pas_identity
      DB_USER: identity
      DB_PASSWORD: identity
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_ISSUER: pas-identity
      JWT_PRIVATE_KEY_PATH: /keys/jwt-private.pem
    volumes:
      - ./infra/keys/jwt-private.pem:/keys/jwt-private.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.identity.loadbalancer.server.port=8001"
      - "traefik.http.middlewares.identity-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.identity-ratelimit.ratelimit.burst=50"
      - "traefik.http.middlewares.api-v1-strip.stripprefix.prefixes=/api/v1"
      - "traefik.http.middlewares.identity-docs-strip.stripprefix.prefixes=/docs/identity"
      # public — no auth (login/refresh/logout must be reachable without a token)
      - "traefik.http.routers.identity-public.rule=PathPrefix(`/api/v1/auth`)"
      - "traefik.http.routers.identity-public.entrypoints=web"
      - "traefik.http.routers.identity-public.middlewares=identity-ratelimit,api-v1-strip"
      # protected — edge validates the RS256 JWT, then injects identity headers
      - "traefik.http.routers.identity.rule=PathPrefix(`/api/v1/users`) || PathPrefix(`/api/v1/roles`) || PathPrefix(`/api/v1/departments`) || PathPrefix(`/api/v1/permissions`)"
      - "traefik.http.routers.identity.entrypoints=web"
      - "traefik.http.routers.identity.middlewares=identity-ratelimit,jwt-auth@file,api-v1-strip"
      # docs - public
      - "traefik.http.routers.identity-docs.rule=PathPrefix(`/docs/identity`)"
      - "traefik.http.routers.identity-docs.entrypoints=web"
      - "traefik.http.routers.identity-docs.service=identity"
      - "traefik.http.routers.identity-docs.middlewares=identity-docs-strip"

  workflow-service:
    build:
      context: .
      dockerfile: services/workflow/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pas_workflow
      DB_USER: workflow
      DB_PASSWORD: workflow
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      IDENTITY_GRPC_HOST: identity-service
      IDENTITY_GRPC_PORT: 50051
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      identity-service:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.workflow.loadbalancer.server.port=8006"
      - "traefik.http.middlewares.workflow-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.workflow-ratelimit.ratelimit.burst=50"
      - "traefik.http.middlewares.workflow-docs-strip.stripprefix.prefixes=/docs/workflow"
      - "traefik.http.routers.workflow.rule=PathPrefix(`/api/v1/workflow-definitions`) || PathPrefix(`/api/v1/workflow-steps`) || PathPrefix(`/api/v1/inbox`)"
      - "traefik.http.routers.workflow.entrypoints=web"
      - "traefik.http.routers.workflow.middlewares=workflow-ratelimit,jwt-auth@file,api-v1-strip"
      # docs - public
      - "traefik.http.routers.workflow-docs.rule=PathPrefix(`/docs/workflow`)"
      - "traefik.http.routers.workflow-docs.entrypoints=web"
      - "traefik.http.routers.workflow-docs.service=workflow"
      - "traefik.http.routers.workflow-docs.middlewares=workflow-docs-strip"

  operations-service:
    build:
      context: .
      dockerfile: services/operations/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pas_operations
      DB_USER: operations
      DB_PASSWORD: operations
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CONTRACT_GRPC_HOST: contract-service
      CONTRACT_GRPC_PORT: 50052
      PRICING_GRPC_HOST: pricing-service
      PRICING_GRPC_PORT: 50053
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8004/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.operations.loadbalancer.server.port=8004"
      - "traefik.http.middlewares.operations-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.operations-ratelimit.ratelimit.burst=50"
      - "traefik.http.routers.operations.rule=PathPrefix(`/api/v1/periods`) || PathPrefix(`/api/v1/volume-records`)"
      - "traefik.http.routers.operations.entrypoints=web"
      - "traefik.http.routers.operations.middlewares=operations-ratelimit,jwt-auth@file,api-v1-strip"

  contract-service:
    build:
      context: .
      dockerfile: services/contract/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pas_contract
      DB_USER: contract
      DB_PASSWORD: contract
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      WORKFLOW_GRPC_HOST: workflow-service
      WORKFLOW_GRPC_PORT: 50056
      ESIGN_GRPC_HOST: esign-service
      ESIGN_GRPC_PORT: 50057
      # a bind inside the container would put uploads on the writable layer, where a redeploy
      # loses every attachment CTR-02 made mandatory
      ATTACHMENT_STORAGE_PATH: /var/pas/attachments
    volumes:
      - attachments:/var/pas/attachments
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      identity-service:
        condition: service_started
      # not service_healthy: D4 commits the submission first and dispatches after, so a
      # contract-service that starts ahead of workflow-service is a retry, not a failure
      workflow-service:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.contract.loadbalancer.server.port=8002"
      - "traefik.http.middlewares.contract-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.contract-ratelimit.ratelimit.burst=50"
      - "traefik.http.routers.contract.rule=PathPrefix(`/api/v1/customers`) || PathPrefix(`/api/v1/contracts`) || PathPrefix(`/api/v1/addenda`) || PathPrefix(`/api/v1/attachments`)"
      - "traefik.http.routers.contract.entrypoints=web"
      - "traefik.http.routers.contract.middlewares=contract-ratelimit,jwt-auth@file,api-v1-strip"

  pricing-service:
    build:
      context: .
      dockerfile: services/pricing/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pas_pricing
      DB_USER: pricing
      DB_PASSWORD: pricing
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      WORKFLOW_GRPC_HOST: workflow-service
      WORKFLOW_GRPC_PORT: 50056
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      workflow-service:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.pricing.loadbalancer.server.port=8003"
      - "traefik.http.middlewares.pricing-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.pricing-ratelimit.ratelimit.burst=50"
      - "traefik.http.middlewares.pricing-docs-strip.stripprefix.prefixes=/docs/pricing"
      - "traefik.http.routers.pricing.rule=PathPrefix(`/api/v1/service-items`) || PathPrefix(`/api/v1/price-lists`)"
      - "traefik.http.routers.pricing.entrypoints=web"
      - "traefik.http.routers.pricing.middlewares=pricing-ratelimit,jwt-auth@file,api-v1-strip"
      - "traefik.http.routers.pricing-docs.rule=PathPrefix(`/docs/pricing`)"
      - "traefik.http.routers.pricing-docs.entrypoints=web"
      - "traefik.http.routers.pricing-docs.service=pricing"
      - "traefik.http.routers.pricing-docs.middlewares=pricing-docs-strip"

  billing-service:
    build:
      context: .
      dockerfile: services/billing/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pas_billing
      DB_USER: billing
      DB_PASSWORD: billing
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CONTRACT_GRPC_HOST: contract-service
      CONTRACT_GRPC_PORT: 50052
      PRICING_GRPC_HOST: pricing-service
      PRICING_GRPC_PORT: 50053
      OPERATIONS_GRPC_HOST: operations-service
      OPERATIONS_GRPC_PORT: 50054
      WORKFLOW_GRPC_HOST: workflow-service
      WORKFLOW_GRPC_PORT: 50056
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      contract-service:
        condition: service_started
      pricing-service:
        condition: service_started
      operations-service:
        condition: service_started
      workflow-service:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.billing.loadbalancer.server.port=8005"
      - "traefik.http.middlewares.billing-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.billing-ratelimit.ratelimit.burst=50"
      - "traefik.http.middlewares.billing-docs-strip.stripprefix.prefixes=/docs/billing"
      - "traefik.http.routers.billing.rule=PathPrefix(`/api/v1/payment-statements`)"
      - "traefik.http.routers.billing.entrypoints=web"
      - "traefik.http.routers.billing.middlewares=billing-ratelimit,jwt-auth@file,api-v1-strip"
      - "traefik.http.routers.billing-docs.rule=PathPrefix(`/docs/billing`)"
      - "traefik.http.routers.billing-docs.entrypoints=web"
      - "traefik.http.routers.billing-docs.service=billing"
      - "traefik.http.routers.billing-docs.middlewares=billing-docs-strip"

  esign-service:
    build:
      context: .
      dockerfile: services/esign/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pas_esign
      DB_USER: esign
      DB_PASSWORD: esign
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CONTRACT_GRPC_HOST: contract-service
      CONTRACT_GRPC_PORT: 50052
      BILLING_GRPC_HOST: billing-service
      BILLING_GRPC_PORT: 50055
      ESIGN_PROVIDER_URL: http://esign-mock-provider:9001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      contract-service:
        condition: service_started
      billing-service:
        condition: service_started
      esign-mock-provider:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.esign.loadbalancer.server.port=8007"
      - "traefik.http.middlewares.esign-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.esign-ratelimit.ratelimit.burst=50"
      - "traefik.http.routers.esign.rule=PathPrefix(`/api/v1/signing-sessions`) || PathPrefix(`/api/v1/callbacks`)"
      - "traefik.http.routers.esign.entrypoints=web"
      - "traefik.http.routers.esign.middlewares=esign-ratelimit,jwt-auth@file,api-v1-strip"

  esign-mock-provider:
    build:
      context: .
      dockerfile: services/esign-mock-provider/Dockerfile
    labels:
      - "traefik.enable=false"

  notification-service:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pas_notification
      DB_USER: notification
      DB_PASSWORD: notification
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      IDENTITY_GRPC_HOST: identity-service
      IDENTITY_GRPC_PORT: 50051
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      # only operations.period_locked needs identity, and a missed lookup retries
      identity-service:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.notification.loadbalancer.server.port=8008"
      - "traefik.http.middlewares.notification-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.notification-ratelimit.ratelimit.burst=50"
      - "traefik.http.middlewares.notification-docs-strip.stripprefix.prefixes=/docs/notification"
      - "traefik.http.routers.notification.rule=PathPrefix(`/api/v1/notifications`)"
      - "traefik.http.routers.notification.entrypoints=web"
      - "traefik.http.routers.notification.middlewares=notification-ratelimit,jwt-auth@file,api-v1-strip"
      # docs - public
      - "traefik.http.routers.notification-docs.rule=PathPrefix(`/docs/notification`)"
      - "traefik.http.routers.notification-docs.entrypoints=web"
      - "traefik.http.routers.notification-docs.service=notification"
      - "traefik.http.routers.notification-docs.middlewares=notification-docs-strip"

  audit-service:
    build:
      context: .
      dockerfile: services/audit/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pas_audit
      DB_USER: audit
      DB_PASSWORD: audit
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    # no identity-service, no owner services: audit consumes pas.audit and calls nobody (D15)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.audit.loadbalancer.server.port=8009"
      - "traefik.http.middlewares.audit-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.audit-ratelimit.ratelimit.burst=50"
      - "traefik.http.middlewares.audit-docs-strip.stripprefix.prefixes=/docs/audit"
      - "traefik.http.routers.audit.rule=PathPrefix(`/api/v1/audit-records`)"
      - "traefik.http.routers.audit.entrypoints=web"
      - "traefik.http.routers.audit.middlewares=audit-ratelimit,jwt-auth@file,api-v1-strip"
      # docs - public
      - "traefik.http.routers.audit-docs.rule=PathPrefix(`/docs/audit`)"
      - "traefik.http.routers.audit-docs.entrypoints=web"
      - "traefik.http.routers.audit-docs.service=audit"
      - "traefik.http.routers.audit-docs.middlewares=audit-docs-strip"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    depends_on:
      - traefik
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_HMR_CLIENT_PORT: "18080"
    volumes:
      - ./web:/app
      - /app/node_modules
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.web.loadbalancer.server.port=80"
      # SPA — lowest priority (len `/` =1) so /api and /docs win
      - "traefik.http.routers.web.rule=PathPrefix(`/`)"
      - "traefik.http.routers.web.entrypoints=web"

volumes:
  pgdata:
  # uploads are the one piece of contract state that is not in Postgres (D12)
  attachments:
